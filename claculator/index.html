<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="cal.css" />

  <body>
    <div class="calculator">
      <div id="display">0</div>

      <div class="buttons">
        <button onclick="remove()">AC</button>
        <button onclick="uildel('/')">÷</button>
        <button onclick="uildel('*')">×</button>
        <button onclick="deleteOne()">⌫</button>

        <button onclick="gargah(7)">7</button>
        <button onclick="gargah(8)">8</button>
        <button onclick="gargah(9)">9</button>
        <button onclick="uildel('-')">−</button>

        <button onclick="gargah(4)">4</button>
        <button onclick="gargah(5)">5</button>
        <button onclick="gargah(6)">6</button>
        <button onclick="uildel('+')">+</button>

        <button onclick="gargah(1)">1</button>
        <button onclick="gargah(2)">2</button>
        <button onclick="gargah(3)">3</button>
        <button onclick="tentsuu()">=</button>

        <button onclick="gargah(0)">0</button>
        <button onclick="gargah('.')">.</button>
        <button onclick="hasahbolgoh()">+/-</button>
        <button onclick="huvi('%')">%</button>
      </div>
    </div>
    <script src="cal.js"></script>
